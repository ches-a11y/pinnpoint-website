<svg viewBox="0 0 440 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="News and stories — customer stories, event highlights and thinking from Pinnpoint" font-family="'Montserrat','Segoe UI',Arial,sans-serif">
  <defs>
    <clipPath id="cardClip"><rect x="115" y="70" width="212" height="205" rx="16"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#04152b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- stacked cards behind (depth) -->
  <g transform="rotate(-7 221 172)"><rect x="126" y="80" width="200" height="188" rx="14" fill="#b9cfe8"/></g>
  <g transform="rotate(4 221 172)"><rect x="122" y="74" width="206" height="196" rx="14" fill="#dbe8f6"/></g>

  <!-- front featured story card -->
  <g filter="url(#soft)">
    <rect x="115" y="70" width="212" height="205" rx="16" fill="#ffffff"/>
  </g>
  <g clip-path="url(#cardClip)">
    <!-- header image band -->
    <rect x="115" y="70" width="212" height="74" fill="#2196f3"/>
    <rect x="115" y="70" width="212" height="74" fill="#1878cf" opacity="0.25"/>
    <!-- abstract photo motif: sun + hills -->
    <circle cx="165" cy="100" r="12" fill="#ffffff" opacity="0.9"/>
    <path d="M115 144 L168 112 L205 132 L258 100 L327 144 Z" fill="#ffffff" opacity="0.18"/>
    <path d="M115 144 L200 120 L262 138 L327 116 L327 144 Z" fill="#ffffff" opacity="0.14"/>
    <!-- category tag -->
    <rect x="131" y="84" width="78" height="20" rx="10" fill="#e07a56"/>
    <text x="170" y="98" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#ffffff">STORIES</text>

    <!-- body of card -->
    <rect x="132" y="162" width="44" height="8" rx="4" fill="#e07a56"/>
    <rect x="132" y="180" width="152" height="12" rx="6" fill="#28374a"/>
    <rect x="132" y="200" width="112" height="12" rx="6" fill="#28374a"/>
    <rect x="132" y="226" width="164" height="7" rx="3.5" fill="#cdd8e5"/>
    <rect x="132" y="240" width="150" height="7" rx="3.5" fill="#cdd8e5"/>
    <!-- byline + read control -->
    <circle cx="141" cy="260" r="9" fill="#dfe8f2"/>
    <rect x="156" y="256" width="66" height="8" rx="4" fill="#c7d2df"/>
    <circle cx="305" cy="259" r="14" fill="#2196f3"/>
    <path d="M300 259 h9 M305 254 l5 5 -5 5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating quote bubble (customer stories) -->
  <g filter="url(#soft)">
    <path d="M300 34 h84 a16 16 0 0 1 16 16 v34 a16 16 0 0 1 -16 16 h-46 l-14 16 v-16 h-24 a16 16 0 0 1 -16 -16 v-34 a16 16 0 0 1 16 -16 z" fill="#ffffff"/>
  </g>
  <text x="316" y="86" font-family="Georgia,'Times New Roman',serif" font-size="58" font-weight="700" fill="#e07a56">&#8220;</text>
  <rect x="352" y="52" width="34" height="7" rx="3.5" fill="#cdd8e5"/>
  <rect x="352" y="66" width="24" height="7" rx="3.5" fill="#cdd8e5"/>

  <!-- floating event chip (event highlights) -->
  <g filter="url(#soft)">
    <rect x="80" y="246" width="132" height="48" rx="13" fill="#ffffff"/>
  </g>
  <rect x="96" y="260" width="22" height="20" rx="3" fill="none" stroke="#2196f3" stroke-width="2.2"/>
  <line x1="96" y1="266" x2="118" y2="266" stroke="#2196f3" stroke-width="2.2"/>
  <line x1="102" y1="256" x2="102" y2="262" stroke="#2196f3" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="112" y1="256" x2="112" y2="262" stroke="#2196f3" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="130" y="262" width="64" height="8" rx="4" fill="#28374a"/>
  <rect x="130" y="276" width="44" height="6" rx="3" fill="#c7d2df"/>

  <!-- small coral accent dot -->
  <circle cx="356" cy="150" r="6" fill="#e07a56"/>
  <circle cx="96" cy="120" r="5" fill="#7bbdf5"/>
</svg>
