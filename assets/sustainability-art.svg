<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sustainable Print and Ship — FSC-certified labels, a tree planted for every box, and no single-use plastic pouch" font-family="'Montserrat','Segoe UI',Arial,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef7f1"/>
      <stop offset="1" stop-color="#e2f1e8"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0 0 C 9 -13 26 -13 34 0 C 26 13 9 13 0 0 Z" fill="#4bb377"/>
      <path d="M4 0 H30" stroke="#2e8f57" stroke-width="1.6"/>
    </g>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="678" height="398" rx="20" fill="url(#sky)" stroke="#d3e7db" stroke-width="1.5"/>

  <!-- soft sun -->
  <circle cx="120" cy="96" r="46" fill="#ffe6bf" opacity="0.7"/>

  <!-- ground -->
  <path d="M1 320 Q 340 296 679 320 L679 380 Q 340 400 1 380 Z" fill="#d6ecdf"/>
  <path d="M1 320 Q 340 296 679 320" fill="none" stroke="#c3e0cf" stroke-width="2"/>

  <!-- tree -->
  <g>
    <rect x="150" y="250" width="16" height="86" rx="4" fill="#9c7551"/>
    <path d="M158 250 v40 M158 274 l-18 -14 M158 288 l18 -14" stroke="#835f40" stroke-width="4" stroke-linecap="round" fill="none"/>
    <ellipse cx="158" cy="196" rx="78" ry="66" fill="#57c07f"/>
    <ellipse cx="120" cy="216" rx="52" ry="44" fill="#4bb377"/>
    <ellipse cx="196" cy="214" rx="54" ry="46" fill="#3fa96c"/>
    <ellipse cx="158" cy="180" rx="46" ry="40" fill="#69cf90"/>
  </g>

  <!-- floating leaves -->
  <g transform="translate(250,120) rotate(-25) scale(0.8)"><use href="#leaf"/></g>
  <g transform="translate(300,190) rotate(20) scale(0.6)"><use href="#leaf"/></g>
  <g transform="translate(520,120) rotate(-12) scale(0.7)"><use href="#leaf"/></g>

  <!-- parcel box with A5 label + leaf badge -->
  <g>
    <!-- box -->
    <path d="M398 236 L488 216 L588 240 L498 262 Z" fill="#f0e0c6" stroke="#cbb083" stroke-width="2" stroke-linejoin="round"/>
    <path d="M398 236 L398 322 L498 346 L498 262 Z" fill="#e7d2b0" stroke="#cbb083" stroke-width="2" stroke-linejoin="round"/>
    <path d="M588 240 L588 326 L498 346 L498 262 Z" fill="#d8bf98" stroke="#cbb083" stroke-width="2" stroke-linejoin="round"/>
    <!-- tape -->
    <path d="M498 262 L498 346" stroke="#cbb083" stroke-width="2"/>
    <!-- A5 label on the box front face -->
    <g transform="translate(430,282) skewY(13.5)">
      <rect x="0" y="0" width="52" height="42" rx="3" fill="#ffffff" stroke="#123350" stroke-width="1.6"/>
      <rect x="0" y="0" width="52" height="8" rx="3" fill="#e07a56"/>
      <line x1="6" y1="18" x2="46" y2="18" stroke="#123350" stroke-width="1.6"/>
      <g stroke="#123350" stroke-width="1.3"><line x1="6" y1="24" x2="6" y2="32"/><line x1="10" y1="24" x2="10" y2="32"/><line x1="15" y1="24" x2="15" y2="32"/><line x1="20" y1="24" x2="20" y2="32"/><line x1="26" y1="24" x2="26" y2="32"/><line x1="32" y1="24" x2="32" y2="32"/><line x1="38" y1="24" x2="38" y2="32"/></g>
    </g>
    <!-- leaf badge -->
    <circle cx="576" cy="222" r="26" fill="#ffffff" stroke="#4bb377" stroke-width="2.5"/>
    <g transform="translate(559,222) scale(0.95)"><use href="#leaf"/></g>
  </g>

  <!-- FSC chip -->
  <g transform="translate(40,300)">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="#ffffff" stroke="#cfe6d8" stroke-width="1.5"/>
    <circle cx="26" cy="20" r="11" fill="#eaf6ef"/>
    <path d="M21 20 l4 4 7 -8" fill="none" stroke="#2e9e5b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="25" font-size="14" font-weight="700" fill="#0e2a47">FSC-certified</text>
  </g>
</svg>
