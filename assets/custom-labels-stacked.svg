<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 600" width="440" height="600" role="img" aria-label="Custom label shapes — rectangular, die-cut round, oval and custom die-cut — available in paper, synthetic and foil materials">
<title>Custom label shapes and materials</title>
<defs>
  <filter id="cls-sh" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0e2a47" flood-opacity="0.13"/>
  </filter>
</defs>

<rect width="440" height="600" rx="20" fill="#f5f8fc"/>

<!-- 1. Rectangular -->
<rect x="22" y="48" width="196" height="156" rx="14" fill="none" stroke="#9fb0c3" stroke-width="1.5" stroke-dasharray="6 5"/>
<g filter="url(#cls-sh)">
  <rect x="30" y="56" width="180" height="140" rx="10" fill="#ffffff" stroke="#0e2a47" stroke-width="2"/>
</g>
<rect x="52" y="80" width="104" height="10" rx="5" fill="#0e2a47"/>
<rect x="52" y="100" width="72" height="8" rx="4" fill="#5c6b7e"/>
<g fill="#0e2a47">
  <rect x="52" y="132" width="4" height="46"/><rect x="60" y="132" width="2" height="46"/>
  <rect x="66" y="132" width="5" height="46"/><rect x="75" y="132" width="2" height="46"/>
  <rect x="81" y="132" width="3" height="46"/><rect x="88" y="132" width="5" height="46"/>
  <rect x="97" y="132" width="2" height="46"/><rect x="103" y="132" width="4" height="46"/>
  <rect x="111" y="132" width="2" height="46"/><rect x="117" y="132" width="5" height="46"/>
  <rect x="126" y="132" width="3" height="46"/><rect x="133" y="132" width="2" height="46"/>
  <rect x="139" y="132" width="5" height="46"/><rect x="148" y="132" width="3" height="46"/>
  <rect x="155" y="132" width="2" height="46"/><rect x="161" y="132" width="4" height="46"/>
</g>

<!-- 2. Die-cut round -->
<circle cx="320" cy="126" r="78" fill="none" stroke="#9fb0c3" stroke-width="1.5" stroke-dasharray="6 5"/>
<g filter="url(#cls-sh)">
  <circle cx="320" cy="126" r="70" fill="#1268bd"/>
</g>
<rect x="285" y="108" width="70" height="10" rx="5" fill="#ffffff"/>
<rect x="295" y="128" width="50" height="8" rx="4" fill="#ffffff" opacity="0.65"/>
<rect x="303" y="148" width="34" height="6" rx="3" fill="#ffffff" opacity="0.45"/>

<!-- 3. Oval -->
<ellipse cx="120" cy="336" rx="96" ry="78" fill="none" stroke="#9fb0c3" stroke-width="1.5" stroke-dasharray="6 5"/>
<g filter="url(#cls-sh)">
  <ellipse cx="120" cy="336" rx="88" ry="70" fill="#ffffff" stroke="#b4522f" stroke-width="2"/>
</g>
<rect x="80" y="316" width="80" height="10" rx="5" fill="#b4522f"/>
<rect x="90" y="336" width="60" height="8" rx="4" fill="#5c6b7e"/>
<rect x="100" y="356" width="40" height="6" rx="3" fill="#9fb0c3"/>

<!-- 4. Custom die-cut -->
<rect x="222" y="258" width="196" height="156" rx="52" fill="none" stroke="#9fb0c3" stroke-width="1.5" stroke-dasharray="6 5"/>
<g filter="url(#cls-sh)">
  <rect x="230" y="266" width="180" height="140" rx="44" fill="#0e2a47"/>
</g>
<rect x="270" y="318" width="100" height="10" rx="5" fill="#ffffff" opacity="0.92"/>
<rect x="270" y="338" width="64" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
<rect x="270" y="358" width="44" height="6" rx="3" fill="#ffffff" opacity="0.4"/>

<!-- shape captions -->
<g font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#5c6b7e" text-anchor="middle">
  <text x="120" y="234">Rectangular</text>
  <text x="320" y="234">Die-cut round</text>
  <text x="120" y="444">Oval</text>
  <text x="320" y="444">Custom die-cut</text>
</g>

<line x1="40" y1="474" x2="400" y2="474" stroke="#e4e9f0" stroke-width="1.5"/>

<!-- materials -->
<g>
  <rect x="14" y="500" width="128" height="44" rx="22" fill="#ffffff" stroke="#e4e9f0" stroke-width="1.5"/>
  <rect x="156" y="500" width="128" height="44" rx="22" fill="#ffffff" stroke="#e4e9f0" stroke-width="1.5"/>
  <rect x="298" y="500" width="128" height="44" rx="22" fill="#ffffff" stroke="#e4e9f0" stroke-width="1.5"/>
</g>
<g font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#0e2a47" text-anchor="middle">
  <text x="78" y="528">Paper</text>
  <text x="220" y="528">Synthetic</text>
  <text x="362" y="528">Foil</text>
</g>
</svg>
