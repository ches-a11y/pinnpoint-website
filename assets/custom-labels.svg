<rect x="40" y="452" width="92" height="30" rx="15" fill="#fff" stroke="#dbe4ee"/><text x="86" y="472" text-anchor="middle" fill="#0e2a47">Paper</text>
<rect x="144" y="452" width="112" height="30" rx="15" fill="#fff" stroke="#dbe4ee"/><text x="200" y="472" text-anchor="middle" fill="#0e2a47">Synthetic</text>
<rect x="268" y="452" width="92" height="30" rx="15" fill="#fff" stroke="#dbe4ee"/><text x="314" y="472" text-anchor="middle" fill="#0e2a47">Foil</text>
