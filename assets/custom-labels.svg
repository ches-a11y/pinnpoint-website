<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="Custom labels">
<defs><filter id="cs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0e2a47" flood-opacity="0.16"/></filter></defs>
<rect width="400" height="560" fill="#fff"/>
<rect x="16" y="20" width="368" height="520" rx="16" fill="#f4f7fb"/>
<text x="200" y="58" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" fill="#2196f3">CUSTOM LABELS</text>
<text x="200" y="80" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6b7f96">Any shape, size, colour or material</text>
