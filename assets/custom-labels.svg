<g filter="url(#cs)"><path d="M120 268 l70 22 v40 c0 44 -34 64 -70 78 c-36 -14 -70 -34 -70 -78 v-40 z" fill="#0e2a47"/><path d="M120 300 l24 18 -9 28 -30 0 -9 -28 z" fill="none" stroke="#8fc7ff" stroke-width="2.4"/><text x="120" y="392" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#8fc7ff">PREMIUM</text></g>
