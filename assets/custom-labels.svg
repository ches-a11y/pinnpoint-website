<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 400" width="856" height="400" role="img" aria-label="Custom label shapes — rectangular, die-cut round, oval and custom die-cut — available in paper, synthetic and foil materials">
<title>Custom label shapes and materials</title>
<defs>
  <filter id="cl-sh" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0e2a47" flood-opacity="0.13"/>
  </filter>
</defs>

<rect width="856" height="400" rx="20" fill="#f5f8fc"/>

<!-- 1. Rectangular -->
<rect x="15" y="66" width="196" height="156" rx="14" fill="none" stroke="#9fb0c3" stroke-width="1.5" stroke-dasharray="6 5"/>
<g filter="url(#cl-sh)">
  <rect x="23" y="74" width="180" height="140" rx="10" fill="#ffffff" stroke="#0e2a47" stroke-width="2"/>
</g>
<rect x="45" y="98" width="104" height="10" rx="5" fill="#0e2a47"/>
<rect x="45" y="118" width="72" height="8" rx="4" fill="#5c6b7e"/>
<g fill="#0e2a47">
  <rect x="45" y="150" width="4" height="46"/><rect x="53" y="150" width="2" height="46"/>
  <rect x="59" y="150" width="5" height="46"/><rect x="68" y="150" width="2" height="46"/>
  <rect x="74" y="150" width="3" height="46"/><rect x="81" y="150" width="5" height="46"/>
  <rect x="90" y="150" width="2" height="46"/><rect x="96" y="150" width="4" height="46"/>
  <rect x="104" y="150" width="2" height="46"/><rect x="110" y="150" width="5" height="46"/>
  <rect x="119" y="150" width="3" height="46"/><rect x="126" y="150" width="2" height="46"/>
  <rect x="132" y="150" width="5" height="46"/><rect x="141" y="150" width="3" height="46"/>
  <rect x="148" y="150" width="2" height="46"/><rect x="154" y="150" width="4" height="46"/>
</g>

<!-- 2. Die-cut round -->
<circle cx="323" cy="144" r="78" fill="none" stroke="#9fb0c3" stroke-width="1.5" stroke-dasharray="6 5"/>
<g filter="url(#cl-sh)">
  <circle cx="323" cy="144" r="70" fill="#1268bd"/>
</g>
<rect x="288" y="126" width="70" height="10" rx="5" fill="#ffffff"/>
<rect x="298" y="146" width="50" height="8" rx="4" fill="#ffffff" opacity="0.65"/>
<rect x="306" y="166" width="34" height="6" rx="3" fill="#ffffff" opacity="0.45"/>

<!-- 3. Oval -->
<ellipse cx="533" cy="144" rx="96" ry="78" fill="none" stroke="#9fb0c3" stroke-width="1.5" stroke-dasharray="6 5"/>
<g filter="url(#cl-sh)">
  <ellipse cx="533" cy="144" rx="88" ry="70" fill="#ffffff" stroke="#b4522f" stroke-width="2"/>
</g>
<rect x="493" y="124" width="80" height="10" rx="5" fill="#b4522f"/>
<rect x="503" y="144" width="60" height="8" rx="4" fill="#5c6b7e"/>
<rect x="513" y="164" width="40" height="6" rx="3" fill="#9fb0c3"/>

<!-- 4. Custom die-cut -->
<rect x="645" y="66" width="196" height="156" rx="52" fill="none" stroke="#9fb0c3" stroke-width="1.5" stroke-dasharray="6 5"/>
<g filter="url(#cl-sh)">
  <rect x="653" y="74" width="180" height="140" rx="44" fill="#0e2a47"/>
</g>
<rect x="693" y="126" width="100" height="10" rx="5" fill="#ffffff" opacity="0.92"/>
<rect x="693" y="146" width="64" height="8" rx="4" fill="#ffffff" opacity="0.6"/>
<rect x="693" y="166" width="44" height="6" rx="3" fill="#ffffff" opacity="0.4"/>

<!-- shape captions -->
<g font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#5c6b7e" text-anchor="middle">
  <text x="113" y="254">Rectangular</text>
  <text x="323" y="254">Die-cut round</text>
  <text x="533" y="254">Oval</text>
  <text x="743" y="254">Custom die-cut</text>
</g>

<line x1="60" y1="284" x2="796" y2="284" stroke="#e4e9f0" stroke-width="1.5"/>

<!-- materials -->
<g>
  <rect x="179" y="308" width="150" height="44" rx="22" fill="#ffffff" stroke="#e4e9f0" stroke-width="1.5"/>
  <rect x="353" y="308" width="150" height="44" rx="22" fill="#ffffff" stroke="#e4e9f0" stroke-width="1.5"/>
  <rect x="527" y="308" width="150" height="44" rx="22" fill="#ffffff" stroke="#e4e9f0" stroke-width="1.5"/>
</g>
<g font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#0e2a47" text-anchor="middle">
  <text x="254" y="336">Paper</text>
  <text x="428" y="336">Synthetic</text>
  <text x="602" y="336">Foil</text>
</g>
</svg>
